# Production stack — Caddy (TLS + React) + FastAPI + Postgres + MinIO
#
# Usage:
#   cp .env.prod.example .env.prod
#   # edit DOMAIN, ACME_EMAIL, secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Prerequisites: DNS A/AAAA for $DOMAIN and storage.$DOMAIN → this server; ports 80/443 open.

name: multistack-hire-prod

services:
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
      args:
        VITE_API_URL: /api
        VITE_BASE_PATH: /
        VITE_ROUTER_BASENAME: ""
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.prod}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: storage.${DOMAIN}
      MINIO_PUBLIC_SECURE: "true"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CORS_ORIGINS: https://${DOMAIN}
      CORS_ORIGIN_REGEX: ""
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
